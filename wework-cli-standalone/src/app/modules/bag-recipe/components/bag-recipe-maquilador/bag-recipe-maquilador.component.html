@for (m of internalFormArray.controls; track m; let i = $index) {
<section class="row">
	<!-- Vinculamos dinámicamente cada grupo a su formulario correspondiente -->
	<article class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-3 p-3 border rounded shadow-sm"
		[formGroup]="asFormGroup(m)">
		<div class="row align-items-center">

			<!-- Selector de Maquilador -->
			<div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
				<mat-form-field appearance="outline" class="example-full-width w-100">
					<mat-label>Maquilador</mat-label>
					<mat-select formControlName="company" placeholder="Seleccionar maquilador">
						@for (company of companyList; track company) {
						<mat-option [value]="company.id">
							{{ company.businessName }}
						</mat-option>
						}
					</mat-select>
				</mat-form-field>
			</div>

			<!-- Input de Cantidad de Bolsas -->
			<div class="col-xl-3 col-lg-3 col-md-12 col-sm-12 mb-2">
				<mat-form-field appearance="outline" class="example-full-width w-100">
					<mat-label>Cantidad de Bolsas</mat-label>
					<input matInput type="text" formControlName="assignedBags" placeholder="Cantidad" appFormattedNumber />
				</mat-form-field>
			</div>

			<!-- Badge de Estado (Principal / Secundario) -->
			<div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 mb-2">
				<span class="badge"
					[ngClass]="{'bg-primary': asFormGroup(m).get('isPrimary')?.value, 'bg-secondary': !asFormGroup(m).get('isPrimary')?.value}">
					{{ asFormGroup(m).get('isPrimary')?.value ? 'Principal' : 'Secundario' }}
				</span>
			</div>

			<!-- Botón de Eliminar (Solo si no es Principal) -->
			<div class="col-xl-1 col-lg-1 col-md-12 col-sm-12 mb-2 text-end">
				@if (!asFormGroup(m).get('isPrimary')?.value) {
				<button mat-icon-button color="warn" type="button" aria-label="Eliminar maquilador"
					(click)="removeMaquilador(i)">
					<mat-icon>delete</mat-icon>
				</button>
				}
			</div>

		</div>
	</article>
</section>
}

<section>
	<div class="example-button-row">
		<div class="example-flex-container">
			<div class="example-button-container">
				<button mat-stroked-button type="button" color="accent" (click)="addMaquilador(false)" class="me-2">
					<mat-icon>add</mat-icon>
					Agregar Maquilador Secundario
				</button>
			</div>
		</div>
	</div>
</section>
