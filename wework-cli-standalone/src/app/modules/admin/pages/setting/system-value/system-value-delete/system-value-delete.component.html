<div class="container">
	<h3 mat-dialog-title>Estas seguro?</h3>
	<div mat-dialog-content>
		<ul class="clearfix">
			<li>
				<p><span class="font-weight-bold"> <b>Estas seguro/a</b> de eliminar la subcategoría?</span> <b>{{ name }}</b>
				</p>
			</li>
		</ul>
	</div>
	<div mat-dialog-actions class="mb-1">
		<button mat-raised-button color="warn" [mat-dialog-close]="1" (click)="remove(id)">
			Eliminar
		</button>
		<button mat-raised-button (click)="closeDialog()" tabindex="-1">Cancelar</button>
	</div>
</div>
