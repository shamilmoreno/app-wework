<div class="addContainer">
	<div class="modalHeader">
		<div class="editRowModal">
			<div class="modalHeader clearfix">
				<!-- <img [src]='shipment.img' alt="avatar"> -->
				<div class="modal-about">
					<div class="font-weight-bold p-t-5 font-17">
						{{ dialogTitle }}</div>
				</div>
			</div>
		</div>
		<button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
			<mat-icon>close</mat-icon>
		</button>
	</div>
	<div mat-dialog-content>
		<form class="register-form m-4" [formGroup]="subcategoryForm" (ngSubmit)="submit">
			<div class="row">
				<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
					<mat-form-field class="example-full-width mb-3" appearance="outline">
						<mat-label>Nombre</mat-label>
						<input matInput formControlName="name" required>
						<!-- <mat-error *ngIf="secondForm.get('name').hasError('required')">
						Name name is required
						</mat-error> -->
					</mat-form-field>
				</div>
			</div>
			<div class="row">
				<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
					<div class="example-button-row">
						<button mat-raised-button color="primary" [disabled]="!subcategoryForm.valid"
							[mat-dialog-close]="1" (click)="saveSubcategoryOnCategory($event)">Guardar</button>
						<button mat-raised-button color="warn" (click)="closeDialog()" tabindex="-1">Cancelar</button>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>
