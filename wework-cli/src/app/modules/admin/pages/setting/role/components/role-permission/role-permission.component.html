<h2 mat-dialog-title>Permisos del rol: {{ role.name }}</h2>

<mat-dialog-content>
	<div *ngIf="isLoading" class="loading-container">
		<p>Cargando permisos...</p>
	</div>

	<form *ngIf="!isLoading" [formGroup]="permissionsForm">
		<mat-accordion multi="true">
			<mat-expansion-panel *ngFor="let group of groupedPermissions">
				<mat-expansion-panel-header>
					<mat-panel-title>
						<mat-checkbox [checked]="isGroupFullyChecked(group)"
							[indeterminate]="isGroupIndeterminate(group)" (click)="$event.stopPropagation()"
							(change)="toggleAllInGroup(group, $event.checked)">
							{{ group.resource }}
						</mat-checkbox>
					</mat-panel-title>
				</mat-expansion-panel-header>

				<div class="permission-list">
					<mat-checkbox *ngFor="let permission of group.permissions"
						[formControlName]="'permission_' + permission.id">
						{{ permission.name }}
					</mat-checkbox>
				</div>
			</mat-expansion-panel>
		</mat-accordion>
	</form>
</mat-dialog-content>

<mat-dialog-actions align="end">
	<button mat-button (click)="closeDialog()">Cancelar</button>
	<button mat-raised-button color="primary" [disabled]="isLoading" (click)="saveChanges()">
		Guardar cambios
	</button>
</mat-dialog-actions>
