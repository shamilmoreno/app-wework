<div class="content-block">
	<div class="block-header" *ngFor="let breadscrum of breadscrums">
		<!-- breadcrumb -->
		<app-breadcrumb [title]="breadscrum.title" [items]="breadscrum.items" [active_item]="breadscrum.active">
		</app-breadcrumb>
	</div>
	<div class="row">
		<div class="col-lg-12 col-md-12">
			<mat-tab-group>
				<mat-tab>
					<ng-template mat-tab-label>
						<i class="material-icons-two-tone psr-3">list_alt</i>
						Vista Lista
					</ng-template>
					<div class="mt-5">
						<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
							<div class="card">
								<div class="body">
									<div class="row clearfix">
										<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
											<div class="responsive_table">
												<div class="materialTableHeader">
													<div class="row align-items-center">
														<div class="col-8 col-md-10 d-flex align-items-center">
															<mat-form-field class="w-100 m-0 p-0" appearance="outline"
																subscriptSizing="dynamic">
																<mat-label>{{ searchTittle }}</mat-label>
																<mat-icon matPrefix
																	class="text-muted me-2">search</mat-icon>
																<input matInput (keyup)="applyFilter($event)"
																	placeholder="Buscar productos..." #input>
															</mat-form-field>
														</div>
														<div
															class="col-4 col-md-2 d-flex align-items-center justify-content-end">
															<ul
																class="header-buttons d-flex list-unstyled justify-content-end gap-1 gap-md-2 m-0 p-0">
																<li>
																	<div class="icon-button-demo">
																		<button mat-mini-fab color="primary"
																			(click)="create()">
																			<mat-icon class="col-white">add</mat-icon>
																		</button>
																	</div>
																</li>
																<li>
																	<div class="icon-button-demo">
																		<button mat-mini-fab color="primary"
																			(click)="dataRefresh()">
																			<mat-icon
																				class="col-white">refresh</mat-icon>
																		</button>
																	</div>
																</li>
															</ul>
														</div>
													</div>
												</div>
												<div class="example-container mat-elevation-z8">
													<mat-table #table [dataSource]="dataSource" matSort
														class="mat-cell">
														<ng-container matColumnDef="code">
															<mat-header-cell *matHeaderCellDef>COÓDIGO</mat-header-cell>
															<mat-cell *matCellDef="let row"
																[innerHTML]="row.code"></mat-cell>
														</ng-container>
														<ng-container matColumnDef="name">
															<mat-header-cell *matHeaderCellDef>ALMACÉN</mat-header-cell>
															<mat-cell *matCellDef="let row"
																[innerHTML]="row.name"></mat-cell>
														</ng-container>
														<ng-container matColumnDef="address">
															<mat-header-cell
																*matHeaderCellDef>UBICACIÓN</mat-header-cell>
															<mat-cell *matCellDef="let row"
																[innerHTML]="row.address"></mat-cell>
														</ng-container>
														<ng-container matColumnDef="actions">
															<mat-header-cell *matHeaderCellDef></mat-header-cell>
															<mat-cell *matCellDef="let row;">
																<mat-menu #menu="matMenu">
																	<!-- <button mat-icon-button
                                                                        matTooltip="Registrar entrada de inventario para el producto seleccionado"
                                                                        matTooltipClass="example-tooltip-red"
                                                                        (click)="addWareHouse(row)">
                                                                        <mat-icon>add</mat-icon>
                                                                    </button> -->
																	<button mat-icon-button matTooltip="Editar receta"
																		matTooltipClass="example-tooltip-red"
																		(click)="update(row)">
																		<mat-icon>edit</mat-icon>
																	</button>
																	<button mat-icon-button
																		matTooltip="Información receta"
																		matTooltipClass="example-tooltip-red"
																		(click)="detail(row)">
																		<mat-icon>info</mat-icon>
																	</button>
																</mat-menu>
																<button mat-icon-button [matMenuTriggerFor]="menu"
																	aria-label="More actions">
																	<mat-icon>more_vert</mat-icon>
																</button>
															</mat-cell>
														</ng-container>
														<mat-header-row *matHeaderRowDef="displayedColumns">
														</mat-header-row>
														<mat-row
															*matRowDef="let row; columns: displayedColumns"></mat-row>
													</mat-table>
													<div class="no-results"
														*ngIf="dataSource && dataSource.data.length === 0">
														<h3 style="text-align: center;">Sin registros para mostrar</h3>
													</div>
													<mat-paginator #paginator [length]="dataLength" [pageIndex]="0"
														[pageSize]="5" [pageSizeOptions]="[5, 10, 25, 100]">
													</mat-paginator>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</mat-tab>
				<mat-tab>
					<ng-template mat-tab-label>
						<i class="material-icons-two-tone psr-3">grid_on</i>
						Vista cuadrícula
					</ng-template>
					<div class="row mt-5 ml-0 mr-0">
						<div class="col-md-4" *ngFor="let wareHouse of wareHouseList; let i = index">
							<div class="card border-apply">
								<div class="m-b-20">
									<div class="contact-grid">
										<div class="profile-header" [ngClass]="{
                                            'bg-green': wareHouse.stock != 0,
                                            'bg-red': wareHouse.stock == 0}">
											<div class="user-name">{{ wareHouse.product }}</div>
											<div *ngIf="wareHouse.stock == 0; else noStock" class="name-center">
												No posee stock
											</div>
											<ng-template #noStock>
												<div class="name-center">
													Si posee stock
												</div>
											</ng-template>
										</div>
										<img src="assets/images/products/clap.jpg" class="user-img" alt="">
										<p>
											<br />Existencia Stock: <strong> {{ wareHouse.stock }} </strong>
										</p>
										<div class="profile-userbuttons">
											<button mat-stroked-button color="primary"
												(click)="detail(wareHouse)">Detalle</button>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</mat-tab>
			</mat-tab-group>
		</div>
	</div>
</div>
